<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>kafene-dardania-v2</title><style>body{margin:0;padding:20px;background:#1a1a1a;display:flex;justify-content:center;align-items:center;height:100vh;}</style></head><body><?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="600" viewBox="0 0 160 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="600" fill="#0A1935"/>

  <!-- Warm amber gradient -->
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD2A4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#DF6B40" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="cupGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFECDA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFECDA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="600" fill="url(#amberGrad)"/>
  <g transform="translate(80, 430)">
    <ellipse cx="0" cy="0" rx="50" ry="10" fill="#FFECDA" fill-opacity="0.15"/>
  </g>

  <!-- Coffee beans scattered -->
  <g transform="translate(60, 380)">
    <ellipse cx="0" cy="0" rx="4" ry="6" fill="#654020" transform="rotate(-20)"/>
    <ellipse cx="24" cy="8" rx="4" ry="6" fill="#654020" transform="rotate(15)"/>
    <ellipse cx="-20" cy="16" rx="4" ry="6" fill="#654020" transform="rotate(5)"/>
    <ellipse cx="40" cy="4" rx="3" ry="5" fill="#654020" transform="rotate(-10)"/>
    <ellipse cx="10" cy="28" rx="4" ry="6" fill="#654020" transform="rotate(30)"/>
  </g>

  <!-- Coffee brewing icon -->
  <g transform="translate(80, 130)">
    <!-- Brewing pot top -->
    <path d="M-25 -10 L25 -10 Q28 -10 28 -7 L22 10 Q-22 10 -22 -7 Q-25 -10 -25 -7 Z"
          fill="#2D1B17"/>
    <!-- Steam -->
    <path d="M-8 -14 C-6 -18, -2 -18, 0 -14 M4 -15 C6 -19, 10 -19, 12 -15"
          stroke="#F5F1E9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Headline -->
  <text x="80" text-anchor="middle" y="200"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="700" fill="#F5F1E9" letter-spacing="-0.4">
    Kafja jote.
  </text>
  <text x="80" text-anchor="middle" y="222"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="700" fill="#F5F1E9" letter-spacing="-0.4">
    Momenti yt.
  </text>

  <!-- Supporting -->
  <text x="80" text-anchor="middle" y="280"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400" fill="#C4C9D8" letter-spacing="0.3">
    Çdo ditë, pranë qendrës së
  </text>
  <text x="80" text-anchor="middle" y="296"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400" fill="#C4C9D8" letter-spacing="0.3">
    Prishtinës.
  </text>

  <!-- CTA -->
  <g transform="translate(80, 390)">
    <rect x="-48" y="-13" width="96" height="26" rx="13"
          fill="#DF6B40"/>
    <text x="0" y="5"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="14" font-weight="600" fill="#FFF" text-anchor="middle" letter-spacing="0.5">
      Shiko ofertën
    </text>
  </g>
</svg>
</body></html>
