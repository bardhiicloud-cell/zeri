<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>banka-per-komunitetin-v2</title><style>body{margin:0;padding:20px;background:#1a1a1a;display:flex;justify-content:center;align-items:center;height:100vh;}</style></head><body><?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="600" viewBox="0 0 160 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="600" fill="#0C1E3A"/>

  <!-- Orange gradient -->
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="160" height="140" fill="url(#orangeGrad)"/>

  <!-- Community building icon -->
  <g transform="translate(80, 160)">
    <!-- Building blocks -->
    <rect x="-18" y="0" width="8" height="22" fill="#38BDF1" rx="1.5"/>
    <rect x="-8" y="8" width="8" height="14" fill="#38BDF1" rx="1.5"/>
    <rect x="2" y="4" width="8" height="18" fill="#38BDF1" rx="1.5"/>
    <rect x="12" y="10" width="8" height="12" fill="#38BDF1" rx="1.5"/>
    <!-- People -->
    <circle cx="-22" cy="-2" r="3.5" fill="#CBD5E1"/>
    <circle cx="22" cy="-2" r="3.5" fill="#CBD5E1"/>
    <circle cx="0" cy="-10" r="3.5" fill="#CBD5E1"/>
  </g>

  <!-- Headline -->
  <text x="80" text-anchor="middle" y="270"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="700" fill="#F5F8FC" letter-spacing="-0.4">
    Së bashku për
  </text>
  <text x="80" text-anchor="middle" y="294"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="700" fill="#F5F8FC" letter-spacing="-0.4">
    lagje më të mira.
  </text>

  <!-- Supporting -->
  <text x="80" text-anchor="middle" y="360"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400" fill="#94A3C1" letter-spacing="0.4">
    Mbështesim ide që përmirësojnë
  </text>
  <text x="80" text-anchor="middle" y="376"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400" fill="#94A3C1" letter-spacing="0.4">
    komunitetin.
  </text>

  <!-- Editorial divider -->
  <rect x="40" y="400" width="80" height="1" fill="#38BDF1" fill-opacity="0.5"/>

  <!-- CTA -->
  <g transform="translate(80, 460)">
    <rect x="-44" y="-12" width="88" height="24" rx="12"
          fill="#38BDF1"/>
    <text x="0" y="5"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="13" font-weight="600" fill="#0C1E3A" text-anchor="middle" letter-spacing="0.5">
      Mëso më shumë
    </text>
  </g>
</svg>
</body></html>
