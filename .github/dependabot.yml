version: 2
updates:
  - package-ecosystem: npm
    directory: /ZERI
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns: ["firebase", "@firebase/*", "firebase-admin"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
