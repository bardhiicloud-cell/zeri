<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ecoclean-prishtina</title><style>body{margin:0;padding:20px;background:#1a1a1a;display:flex;justify-content:center;align-items:center;height:100vh;}</style></head><body><?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="600" viewBox="0 0 160 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fresh white background -->
  <rect width="160" height="600" fill="#F8FAFC"/>

  <!-- Subtle mint accent band at top -->
  <rect width="160" height="120" fill="#E8F5F0"/>
  <path d="M0 100 Q40 110, 80 105 Q120 100, 160 110 L160 120 L0 120 Z"
        fill="#E8F5F0" opacity="0.6"/>

  <!-- Clean modern living room (minimal geometric shapes) -->
  <g transform="translate(50, 150)">
    <!-- Sofa -->
    <rect x="10" y="0" width="60" height="22" rx="4" fill="#D1FAE5"/>
    <!-- Coffee table -->
    <rect x="30" y="10" width="20" height="12" rx="2" fill="#94A3B8"/>
    <!-- Plant -->
    <circle cx="80" cy="10" r="4" fill="#4ADE80"/>
    <path d="M80 14 L78 20 L82 20 Z" fill="#22C55E"/>
  </g>

  <!-- Headline -->
  <text x="80" text-anchor="middle" y="290"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#1E293B"
        letter-spacing="-0.5">
    Shtëpi e pastër.
  </text>
  <text x="80" text-anchor="middle" y="316"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#1E293B"
        letter-spacing="-0.5">
    Mendje e qetë.
  </text>

  <!-- Supporting text -->
  <text x="80" text-anchor="middle" y="370"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="400"
        fill="#64748B"
        letter-spacing="0.3">
    Pastrime profesionale për
  </text>
  <text x="80" text-anchor="middle" y="386"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="400"
        fill="#64748B"
        letter-spacing="0.3">
    shtëpi dhe biznese.
  </text>

  <!-- Geometric accent -->
  <circle cx="80" cy="415" r="2" fill="#4ADE80"/>

  <!-- CTA Button -->
  <g transform="translate(80, 470)">
    <rect x="-40" y="-12" width="80" height="24" rx="12"
          fill="#2DD36F"/>
    <text x="0" y="5"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="0.5">
      Rezervo tani
    </text>
  </g>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="159" height="599" rx="0"
        fill="none" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.5"/>
</svg>
</body></html>
