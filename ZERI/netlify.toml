[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Firebase WEB config (apiKey, appId, senderId...) is public by design: it ships in every client
# bundle and is protected by Firestore/Storage rules, not by secrecy. Netlify's secret scanner would
# otherwise fail the build on it. Never add a real server secret (service account, GEMINI key) here.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_FIRESTORE_DATABASE_ID"
  SECRETS_SCAN_OMIT_PATHS = "firebase-applet-config.json,ZERI/firebase-applet-config.json"

# SPA fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
