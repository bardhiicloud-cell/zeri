<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Pinch-zoom stays enabled (WCAG 1.4.4); viewport-fit=cover lets the layout use notch/safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F0F7FF" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Zëri Qytetarëve — Platforma Kombëtare e Angazhimit Qytetar të Republikës së Kosovës</title>
    <meta name="description" content="Platforma Zëri Qytetarëve i mundëson qytetarëve të raportojnë çështje, të ndiqin zgjidhjen e tyre, të votojnë në sondazhe dhe të kontribuojnë në vendimmarrjen komunale të Kosovës." />
    <meta name="keywords" content="qytetar, kosova, raporto, siguria, komuna, transparent, angazhim qytetar" />

    <!-- Icons: SVG favicon works everywhere modern; ICO fallback for older crawlers -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Zëri" />
    <meta name="application-name" content="Zëri Qytetarëve" />
    <meta name="msapplication-TileColor" content="#0A192F" />

    <!--
      Albanian is the official language of the Republic of Kosovo. Declaring it as
      the only alternate keeps crawlers and browser translation prompts on the
      Albanian original instead of guessing a visitor's locale.
    -->
    <link rel="canonical" href="https://zeriqytetarve.com/" />
    <link rel="alternate" hreflang="sq" href="https://zeriqytetarve.com/" />
    <link rel="alternate" hreflang="x-default" href="https://zeriqytetarve.com/" />

    <meta property="og:locale" content="sq_AL" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zëri Qytetarëve" />
    <meta property="og:title" content="Zëri Qytetarëve — Raportoni, ndiqni, vendosni" />
    <meta property="og:description" content="Raportoni çështjet, ndiqni zgjidhjet, merrni pjesë në vendimmarrjen komunale." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zeriqytetareve" />
    <meta property="og:image" content="https://zeriqytetarve.com/cover.jpg" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="744" />

    <!--
      Pre-paint theme. Runs before the first frame so a visitor whose phone is in
      night mode never sees a white flash. Order: the visitor's own toggle choice,
      then the device setting (prefers-color-scheme), then day. Keep in sync with
      analyzeTheme() in src/lib/themePreference.ts.
    -->
    <script>
      (function () {
        try {
          var choice = null;
          try { choice = localStorage.getItem('zeri-theme-choice'); } catch (e) {}
          var dark = choice === 'dark' ||
            (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1220' : '#F0F7FF');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
