# Netlify build for the deploy previews. The app lives in ZERI/; the live site is
# published separately to Firebase Hosting (.github/workflows/deploy-hosting.yml).
[build]
  base = "ZERI"
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Firebase web config is public by design and ends up in the browser bundle; Netlify's
  # secret scan would otherwise fail the build on it.
  SECRETS_SCAN_OMIT_PATHS = "dist/**"

# Single-page app: every path that is not a file serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
