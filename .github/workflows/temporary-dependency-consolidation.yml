name: Temporary safe dependency consolidation
on:
  push:
    branches:
      - fix/npm-audit-remediation
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - name: Install locked dependencies
        working-directory: ZERI
        run: npm ci
      - name: Apply compatible patch updates from PRs 54 and 55
        working-directory: ZERI
        run: npm install react-dom@^19.3.1 zustand@^5.0.16
      - name: Apply non-breaking production security updates
        working-directory: ZERI
        run: npm audit fix --omit=dev || true
      - name: Verify production dependency audit
        working-directory: ZERI
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZERI/package.json ZERI/package-lock.json
          git rm .github/workflows/temporary-dependency-consolidation.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 1
          fi
          git commit -m "fix(deps): consolidate safe updates and production security fixes"
          git push origin HEAD:fix/npm-audit-remediation
