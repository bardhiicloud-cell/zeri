<?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="600" viewBox="0 0 160 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark navy background -->
  <rect width="160" height="600" fill="#0C1E3A"/>

  <!-- Deep orange accent gradient band -->
  <defs>
    <linearGradient id="orangeBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="communityGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38BDF1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="140" fill="url(#orangeBand)"/>
  <rect width="160" height="600" fill="url(#communityGlow)"/>

  <!-- Diverse Kosovo community scene (minimal silhouettes) -->
  <g transform="translate(80, 190)">
    <!-- People silhouettes -->
    <circle cx="-20" cy="0" r="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="-24" y="4" width="8" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="-4" y="4" width="8" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="20" cy="0" r="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="16" y="4" width="8" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <!-- Connecting line (community unity) -->
    <line x1="-16" y1="2" x2="16" y2="2" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Headline -->
  <text x="80" text-anchor="middle" y="300"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="21"
        font-weight="700"
        fill="#F5F8FC"
        letter-spacing="-0.4">
    Së bashku për
  </text>
  <text x="80" text-anchor="middle" y="324"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="21"
        font-weight="700"
        fill="#F5F8FC"
        letter-spacing="-0.4">
    lagje më të mira.
  </text>

  <!-- Supporting text -->
  <text x="80" text-anchor="middle" y="375"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="400"
        fill="#94A3C1"
        letter-spacing="0.4">
    Mbështesim ide që përmirësojnë
  </text>
  <text x="80" text-anchor="middle" y="391"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="400"
        fill="#94A3C1"
        letter-spacing="0.4">
    komunitetin.
  </text>

  <!-- Editorial divider -->
  <rect x="40" y="415" width="80" height="1" fill="#38BDF1" fill-opacity="0.5"/>

  <!-- CTA Button -->
  <g transform="translate(80, 470)">
    <rect x="-40" y="-12" width="80" height="24" rx="12"
          fill="#38BDF1"/>
    <text x="0" y="5"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#0C1E3A"
          text-anchor="middle"
          letter-spacing="0.5">
      Mëso më shumë
    </text>
  </g>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="159" height="599" rx="0"
        fill="none" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.5"/>
</svg>
