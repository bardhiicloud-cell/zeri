name: Keep the API awake

# Render's free plan puts the /api server to sleep after 15 minutes without traffic;
# the next visitor then waits 30–60 s and the admin panel looks broken. A request
# every 10 minutes keeps it awake (one free service fits in Render's 750 h/month).
# Does nothing until the API_BASE_URL variable is set (see deploy-hosting.yml).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API" ]; then echo "API_BASE_URL is not set: nothing to ping."; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "$API/api/health" || echo "::warning::$API/api/health did not answer"
