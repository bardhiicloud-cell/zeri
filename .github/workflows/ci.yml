name: CI

# Lives at the repository root: GitHub only reads workflows from here. The app is in ./ZERI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ZERI

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Lint gate covers files known to be clean; the wider code base still has
      # ~1,470 legacy errors (see REPOSITORY_AUDIT_REPORT.md, F-28).
      - run: npx eslint tests server/roleClaims.ts server/policy.ts server/gdpr.ts server/polls.ts server/upvotes.ts server/reports.ts src/lib/apiAuth.ts src/lib/escapeHtml.ts scripts/sync-claims.ts
      - run: npm test
      - run: npm run build
      - name: Dependency audit (report only)
        run: npm audit --omit=dev || true

  rules:
    name: Firestore and Storage rules, server transactions (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
