name: Temporary npm audit remediation
on:
  push:
    branches:
      - fix/npm-audit-remediation
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - name: Install locked dependencies
        working-directory: ZERI
        run: npm ci
      - name: Apply non-breaking security updates
        working-directory: ZERI
        run: npm audit fix
      - name: Verify production dependency audit
        working-directory: ZERI
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZERI/package.json ZERI/package-lock.json
          git rm .github/workflows/temporary-audit-remediation.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 1
          fi
          git commit -m "fix(security): update vulnerable production dependencies"
          git push origin HEAD:fix/npm-audit-remediation
