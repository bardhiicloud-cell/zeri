name: CI

# Lives at the repository root: GitHub only reads workflows from here. The app is in ./ZERI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ZERI

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Lint gate covers files known to be clean; the wider code base still has legacy
      # findings (counts and plan: docs/CI_REMEDIATION.md). Add a file here once it is clean.
      - run: npx eslint tests server/roleClaims.ts server/policy.ts server/gdpr.ts server/polls.ts server/upvotes.ts server/reports.ts server/reportAssignment.ts server/staffRemoval.ts server/publicReports.ts src/lib/apiAuth.ts src/lib/escapeHtml.ts src/lib/publicReportsApi.ts src/lib/handoverHistory.ts src/lib/reportAssignmentApi.ts src/components/admin/HandoverHistoryPanel.tsx scripts/sync-claims.ts scripts/reportsLockdownRules.ts
      # React Hooks rules over all of src. New violations fail the build; files with older findings are
      # listed as warnings in eslint.hooks.config.js and must only shrink.
      - run: npx eslint -c eslint.hooks.config.js src
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Dependency audit (high and critical block)
        run: npm audit --omit=dev --audit-level=high

  rules:
    name: Firestore and Storage rules, server transactions (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
      # Needs the Auth emulator too (staff accounts sign in), so it has its own emulator run.
      - run: npm run test:workflow

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists the PR's commits through the API; without pull-requests: read it gets 403 on every PR.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Smoke and accessibility (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ZERI/test-results
