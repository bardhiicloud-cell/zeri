<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>kafene-dardania</title><style>body{margin:0;padding:20px;background:#1a1a1a;display:flex;justify-content:center;align-items:center;height:100vh;}</style></head><body><?xml version="1.0" encoding="UTF-8"?>
<svg width="160" height="600" viewBox="0 0 160 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep navy background -->
  <rect width="160" height="600" fill="#0A1935"/>

  <!-- Warm sunlight glow at top -->
  <radialGradient id="sunlight" cx="50%" cy="15%" r="70%" fx="50%" fy="15%">
    <stop offset="0%" stop-color="#FDE1B9" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FDE1B9" stop-opacity="0"/>
  </radialGradient>
  <rect width="160" height="600" fill="url(#sunlight)"/>

  <!-- Espresso cup illustration -->
  <g transform="translate(40, 110)">
    <!-- Cup body -->
    <path d="M10 40 C10 15, 45 5, 60 15 C75 5, 90 20, 90 40 C90 60, 75 70, 60 70 L30 70 C15 70, 10 60, 10 40 Z"
          fill="#2D1B17"/>
    <!-- Cup rim highlight -->
    <path d="M12 28 C12 17, 42 10, 58 16 C72 22, 80 35, 78 40" fill="none" stroke="#5D4634" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M28 5 C30 1, 34 1, 36 5 M44 10 C46 6, 50 6, 52 10 M58 13 C60 9, 64 9, 66 13"
          fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8" stroke-linecap="round"/>
    <!-- Saucer -->
    <ellipse cx="50" cy="68" rx="38" ry="4" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>

  <!-- Headline -->
  <text x="80" text-anchor="middle" y="220"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#F5F1E9"
        letter-spacing="-0.5">
    Kafja jote.
  </text>
  <text x="80" text-anchor="middle" y="246"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#F5F1E9"
        letter-spacing="-0.5">
    Momenti yt.
  </text>

  <!-- Supporting text -->
  <text x="80" text-anchor="middle" y="300"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="400"
        fill="#C4C9D8"
        letter-spacing="0.3">
    Çdo ditë, pranë qendrës së
  </text>
  <text x="80" text-anchor="middle" y="318"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="400"
        fill="#C4C9D8"
        letter-spacing="0.3">
    Prishtinës.
  </text>

  <!-- CTA Button -->
  <g transform="translate(80, 430)">
    <rect x="-50" y="-14" width="100" height="28" rx="14"
          fill="#DF6B40"/><!-- Terracotta -->
    <text x="0" y="5"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="14"
          font-weight="600"
          fill="#FFF"
          text-anchor="middle"
          letter-spacing="0.5">
      Shiko ofertën
    </text>
  </g>
</svg>
</body></html>
