version: 2
updates:
  - package-ecosystem: npm
    directory: /ZERI
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major bumps change behaviour the CI gates depend on (vitest 5 measures coverage differently
      # from 3). Take them deliberately, with the thresholds re-measured, not through an automatic PR.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      firebase:
        patterns: ["firebase", "@firebase/*", "firebase-admin"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
