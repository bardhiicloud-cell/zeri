name: Deploy to Firebase Hosting

# Builds ZERI/ and publishes it to Firebase Hosting (zeriqytetarve.com), the same as
#   cd ZERI && vite build && firebase deploy --only hosting --project gen-lang-client-0907710011
# but from GitHub, so a deploy needs no computer.
#
# Runs on every push to main that changes the app, and on demand (Actions → this
# workflow → Run workflow). Needs one repository secret, FIREBASE_SERVICE_ACCOUNT:
# the full JSON of a service-account key (Firebase Console → Project settings →
# Service accounts → Generate new private key). Without it the job stops with a
# message instead of failing.
on:
  push:
    branches: [main]
    paths:
      - 'ZERI/**'
      - '.github/workflows/deploy-hosting.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZERI
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check the deploy key
        if: env.HAS_KEY != 'true'
        working-directory: .
        run: |
          echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set: nothing was deployed. Add it under Settings → Secrets and variables → Actions."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZERI/package-lock.json
      - if: env.HAS_KEY == 'true'
        run: npm ci
      # Full history is not needed: version.json takes the commit from the checkout.
      # VITE_API_BASE: where the /api server runs (Render / Cloud Run). Set it once under
      # Settings → Secrets and variables → Actions → Variables → API_BASE_URL,
      # e.g. https://zeri-api.onrender.com. Empty = same origin.
      - if: env.HAS_KEY == 'true'
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
        run: node node_modules/vite/bin/vite.js build
      - name: Deploy
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gen-lang-client-0907710011
          entryPoint: ZERI
          channelId: live
      # The database and storage rules travel with the code, so a change to
      # firestore.rules (and the indexes the server queries need) goes live with
      # the site. Uses the same service-account key. Never blocks the site deploy.
      - name: Deploy Firestore and Storage rules and indexes
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only firestore,storage --project gen-lang-client-0907710011 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Show the deployed version
        if: env.HAS_KEY == 'true'
        run: cat dist/version.json
      # What the public domain actually serves now, seen from outside: the commit in
      # /version.json and the cache header on a page route.
      - name: Check zeriqytetarve.com
        if: env.HAS_KEY == 'true'
        run: |
          want=$(node -p "require('./dist/version.json').commit")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://zeriqytetarve.com/version.json?t=$(date +%s)" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).commit" || true)
            echo "zeriqytetarve.com serves: ${got:-?} (expected $want)"
            [ "$got" = "$want" ] && break
            sleep 10
          done
          curl -sSI https://zeriqytetarve.com/raporto | grep -i '^cache-control' || true
          [ "$got" = "$want" ] || echo "::warning::zeriqytetarve.com does not serve $want yet"
